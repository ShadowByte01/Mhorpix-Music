<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="deskGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.09)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="deskCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="deskGlow">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Desktop App Window Frame -->
  <rect width="1920" height="1080" rx="16" fill="url(#deskBg)"/>

  <!-- Window Titlebar with Windows 11 Fluent Glass -->
  <rect width="1920" height="54" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Window Controls -->
  <circle cx="40" cy="27" r="7" fill="#ff5f56"/>
  <circle cx="65" cy="27" r="7" fill="#ffbd2e"/>
  <circle cx="90" cy="27" r="7" fill="#27c93f"/>
  <text x="960" y="34" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">Mhorpix Desktop · SMTC &amp; Windows Media Controls Active</text>

  <!-- Left Sidebar (Glass panel) -->
  <rect x="24" y="78" width="320" height="978" rx="16" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="64" cy="120" r="20" fill="#00f2fe"/>
  <text x="100" y="128" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Mhorpix</text>
  <!-- Nav items -->
  <rect x="44" y="180" width="280" height="48" rx="12" fill="rgba(0,242,254,0.15)" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
  <text x="90" y="211" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#00f2fe">Home</text>
  <text x="90" y="271" font-family="-apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)">Explore</text>
  <text x="90" y="331" font-family="-apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)">Library</text>
  <text x="90" y="391" font-family="-apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)">Offline Downloads</text>
  <text x="90" y="451" font-family="-apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)">P2P Listen Together</text>

  <!-- Main Content Area -->
  <g transform="translate(368, 78)">
    <!-- Hero Banner in App -->
    <rect width="1528" height="340" rx="20" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="1300" cy="170" r="160" fill="#00f2fe" opacity="0.12" filter="url(#deskGlow)"/>
    <text x="60" y="120" font-family="-apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Hi-Res Lossless Audio Desktop Client</text>
    <text x="60" y="170" font-family="-apple-system, sans-serif" font-size="20" fill="rgba(255,255,255,0.65)">Windows SMTC, Global Media Keys, Rich Presence &amp; Liquid Glass UI</text>

    <!-- Cards Grid -->
    <g transform="translate(0, 380)">
      <rect x="0" y="0" width="360" height="420" rx="16" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="20" y="20" width="320" height="260" rx="12" fill="#182236"/>
      <text x="24" y="320" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Top 100 Global</text>
      <text x="24" y="350" font-family="-apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">YouTube Music Official</text>

      <rect x="388" y="0" width="360" height="420" rx="16" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="408" y="20" width="320" height="260" rx="12" fill="#1e1836"/>
      <text x="412" y="320" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Acoustic Lo-Fi Beats</text>
      <text x="412" y="350" font-family="-apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">FLAC 24-bit 96kHz</text>

      <rect x="776" y="0" width="360" height="420" rx="16" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="796" y="20" width="320" height="260" rx="12" fill="#361828"/>
      <text x="800" y="320" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Synthwave &amp; Cyber</text>
      <text x="800" y="350" font-family="-apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Automix Enabled</text>

      <rect x="1164" y="0" width="360" height="420" rx="16" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="1184" y="20" width="320" height="260" rx="12" fill="#183628"/>
      <text x="1188" y="320" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Ambient Chillout</text>
      <text x="1188" y="350" font-family="-apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Word-Synced Lyrics</text>
    </g>
  </g>

  <!-- Bottom Player Bar (Liquid Glass) -->
  <rect x="368" y="930" width="1528" height="126" rx="20" fill="url(#deskGlass)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <rect x="390" y="950" width="86" height="86" rx="12" fill="#141c2e"/>
  <text x="496" y="985" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Midnight City</text>
  <text x="496" y="1015" font-family="-apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">M83 · Hurry Up, We're Dreaming (Hi-Res FLAC)</text>
  <!-- Controls -->
  <circle cx="1132" cy="993" r="30" fill="url(#deskCyan)"/>
  <path d="M1126 980 l16 13 l-16 13 z" fill="#0a0e17"/>
</svg>
