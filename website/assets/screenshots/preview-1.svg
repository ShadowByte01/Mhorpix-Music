<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1080" height="2340" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="500" r="300" fill="#00f2fe" opacity="0.15" filter="url(#glow)"/>
  <circle cx="880" cy="1400" r="350" fill="#f857a6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="540" cy="1900" r="280" fill="#8a2387" opacity="0.1" filter="url(#glow)"/>

  <!-- Top bar placeholder -->
  <rect x="60" y="140" width="960" height="90" rx="45" fill="url(#glass)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="120" cy="185" r="22" fill="#00f2fe" opacity="0.8"/>
  <rect x="170" y="172" width="220" height="26" rx="13" fill="rgba(255,255,255,0.7)"/>
  <circle cx="940" cy="185" r="20" fill="rgba(255,255,255,0.4)"/>
  <circle cx="870" cy="185" r="20" fill="rgba(255,255,255,0.4)"/>

  <!-- Album Artwork Placeholder Card -->
  <g transform="translate(140, 360)">
    <rect width="800" height="800" rx="48" fill="#182236" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
    <circle cx="400" cy="400" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="80"/>
    <circle cx="400" cy="400" r="90" fill="url(#cyanGrad)"/>
    <circle cx="400" cy="400" r="30" fill="#0a0e17"/>
    <!-- Note icon -->
    <path d="M385 365 v70 a25 25 0 1 1 -20 -24 v-46 l70 -15 v55 a25 25 0 1 1 -20 -24 v-60 z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Track Info -->
  <rect x="140" y="1240" width="500" height="48" rx="24" fill="#ffffff" opacity="0.9"/>
  <rect x="140" y="1310" width="320" height="32" rx="16" fill="rgba(255,255,255,0.45)"/>

  <!-- Quality Badge: Hi-Res FLAC 24-bit 96kHz -->
  <rect x="140" y="1380" width="260" height="42" rx="12" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="2"/>
  <text x="270" y="1408" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#00f2fe" text-anchor="middle">HI-RES LOSSLESS</text>

  <!-- Scrubber Waveform / Slider -->
  <rect x="140" y="1470" width="800" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
  <rect x="140" y="1470" width="460" height="12" rx="6" fill="url(#cyanGrad)"/>
  <circle cx="600" cy="1476" r="16" fill="#ffffff" filter="url(#glow)"/>
  <text x="140" y="1520" font-family="-apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.5)">2:14</text>
  <text x="940" y="1520" font-family="-apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.5)" text-anchor="end">4:08</text>

  <!-- Controls Panel in Liquid Glass -->
  <rect x="100" y="1580" width="880" height="220" rx="44" fill="url(#glass)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
  <!-- Previous -->
  <path d="M330 1690 l-50 35 v-70 z M270 1655 h10 v70 h-10 z" fill="#ffffff" opacity="0.85"/>
  <!-- Play/Pause Button -->
  <circle cx="540" cy="1690" r="64" fill="url(#cyanGrad)"/>
  <path d="M525 1660 l45 30 l-45 30 z" fill="#0a0e17"/>
  <!-- Next -->
  <path d="M750 1690 l-50 -35 v70 z M760 1655 h10 v70 h-10 z" fill="#ffffff" opacity="0.85" transform="rotate(180 750 1690)"/>

  <!-- Liquid Glass Bottom Bar -->
  <rect x="140" y="2100" width="800" height="110" rx="55" fill="url(#glass)" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
  <circle cx="300" cy="2155" r="26" fill="#00f2fe"/>
  <circle cx="540" cy="2155" r="22" fill="rgba(255,255,255,0.35)"/>
  <circle cx="780" cy="2155" r="22" fill="rgba(255,255,255,0.35)"/>

  <!-- Label Overlay -->
  <rect x="190" y="960" width="700" height="90" rx="20" fill="rgba(0,0,0,0.65)" stroke="#00f2fe" stroke-width="2"/>
  <text x="540" y="1015" font-family="-apple-system, sans-serif" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">Now Playing Screen Preview</text>
</svg>
